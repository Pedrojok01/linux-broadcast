name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  deb:
    name: Build and publish .deb
    runs-on: ubuntu-latest
    # Only this job publishes the GitHub release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check tag matches Cargo version
        run: |
          manifest_version="$(
            awk '
              $0 == "[workspace.package]" { in_section = 1; next }
              /^\[/ && in_section { exit }
              in_section && $1 == "version" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ -z "$manifest_version" ]; then
            echo "Could not read [workspace.package].version from Cargo.toml"
            exit 1
          fi

          if [ "$tag_version" != "$manifest_version" ]; then
            echo "Tag version ($tag_version) does not match Cargo.toml version ($manifest_version)"
            exit 1
          fi

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgtk-3-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build main Debian package (cuda build, auto-detects GPU at runtime)
        # ORT_CUDA_VERSION=13 comes from .cargo/config.toml. The cuda binary
        # hard-links no CUDA libs, so it runs CPU-only without the add-on.
        run: |
          cargo build --release -p linux-broadcast --features cuda
          cargo deb -p linux-broadcast --no-build

      - name: Build CUDA provider-libs add-on package
        # No GPU needed: this only downloads + repackages the ONNX Runtime
        # CUDA provider .so files into the linux-broadcast-cuda .deb.
        run: packaging/build-cuda-addon.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: target/debian/*.deb
          generate_release_notes: true

  aur:
    name: Publish linux-broadcast-bin to AUR
    needs: deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve version
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for .deb asset to be reachable
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          url="https://github.com/Pedrojok01/linux-broadcast/releases/download/v${VERSION}/linux-broadcast_${VERSION}-1_amd64.deb"
          for attempt in $(seq 1 20); do
            if curl -sfLI "$url" -o /dev/null; then
              echo "Asset available: $url"
              exit 0
            fi
            echo "Attempt $attempt: $url not ready yet, sleeping 15s..."
            sleep 15
          done
          echo "Timed out waiting for $url" >&2
          exit 1

      - name: Pin pkgver and sha256 in PKGBUILD
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          url="https://github.com/Pedrojok01/linux-broadcast/releases/download/v${VERSION}/linux-broadcast_${VERSION}-1_amd64.deb"
          curl -sSfL "$url" -o /tmp/lb.deb
          sum="$(sha256sum /tmp/lb.deb | awk '{print $1}')"

          sed -i -E "s/^pkgver=.*/pkgver=${VERSION}/" packaging/aur/PKGBUILD
          sed -i -E "s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
          sed -i -E "s|^sha256sums=.*|sha256sums=('${sum}')|" packaging/aur/PKGBUILD

      - name: Regenerate .SRCINFO
        run: |
          docker run --rm -v "$PWD/packaging/aur:/aur" archlinux:base-devel bash -c '
            useradd -m builder
            cp -r /aur/. /tmp/aur
            chown -R builder /tmp/aur
            su builder -c "cd /tmp/aur && makepkg --printsrcinfo" > /aur/.SRCINFO
          '

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail

          # SSH setup. Host keys are pinned in .github/aur_known_hosts. IPv4
          # only: AUR sometimes serves stale AAAA records.
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          cp .github/aur_known_hosts ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
              User aur
              IdentityFile ~/.ssh/aur_key
              IdentitiesOnly yes
              StrictHostKeyChecking yes
              AddressFamily inet
          EOF
          chmod 600 ~/.ssh/config

          # Clone existing AUR repo, copy in the rewritten files.
          git clone ssh://aur@aur.archlinux.org/linux-broadcast-bin.git /tmp/aur-repo
          cp packaging/aur/PKGBUILD          /tmp/aur-repo/PKGBUILD
          cp packaging/aur/.SRCINFO          /tmp/aur-repo/.SRCINFO
          cp packaging/aur/linux-broadcast.install /tmp/aur-repo/linux-broadcast.install

          cd /tmp/aur-repo
          git config user.name "Pedrojok01"
          git config user.email "pedrojok@pm.me"
          git add PKGBUILD .SRCINFO linux-broadcast.install

          if git diff --cached --quiet; then
            echo "No AUR-side changes — already at $VERSION-1."
            exit 0
          fi
          git commit -m "linux-broadcast-bin ${VERSION}-1"
          git push origin master

  aur-cuda:
    name: Publish linux-broadcast-cuda to AUR
    needs: deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve version
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for add-on .deb asset to be reachable
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          url="https://github.com/Pedrojok01/linux-broadcast/releases/download/v${VERSION}/linux-broadcast-cuda_${VERSION}-1_amd64.deb"
          for attempt in $(seq 1 20); do
            if curl -sfLI "$url" -o /dev/null; then
              echo "Asset available: $url"; exit 0
            fi
            echo "Attempt $attempt: $url not ready yet, sleeping 15s..."; sleep 15
          done
          echo "Timed out waiting for $url" >&2; exit 1

      - name: Pin pkgver and sha256 in PKGBUILD
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          url="https://github.com/Pedrojok01/linux-broadcast/releases/download/v${VERSION}/linux-broadcast-cuda_${VERSION}-1_amd64.deb"
          curl -sSfL "$url" -o /tmp/lb-cuda.deb
          sum="$(sha256sum /tmp/lb-cuda.deb | awk '{print $1}')"
          sed -i -E "s/^pkgver=.*/pkgver=${VERSION}/" packaging/aur-cuda/PKGBUILD
          sed -i -E "s/^pkgrel=.*/pkgrel=1/" packaging/aur-cuda/PKGBUILD
          sed -i -E "s|^sha256sums=.*|sha256sums=('${sum}')|" packaging/aur-cuda/PKGBUILD

      - name: Regenerate .SRCINFO
        run: |
          docker run --rm -v "$PWD/packaging/aur-cuda:/aur" archlinux:base-devel bash -c '
            useradd -m builder
            cp -r /aur/. /tmp/aur
            chown -R builder /tmp/aur
            su builder -c "cd /tmp/aur && makepkg --printsrcinfo" > /aur/.SRCINFO
          '

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur_key; chmod 600 ~/.ssh/aur_key
          cp .github/aur_known_hosts ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
              User aur
              IdentityFile ~/.ssh/aur_key
              IdentitiesOnly yes
              StrictHostKeyChecking yes
              AddressFamily inet
          EOF
          chmod 600 ~/.ssh/config
          # The AUR repo must be created manually once (see packaging/aur-cuda/
          # PKGBUILD). Until then, skip without failing the release.
          if ! git clone ssh://aur@aur.archlinux.org/linux-broadcast-cuda.git /tmp/aur-repo; then
            echo "::warning::AUR repo linux-broadcast-cuda not reachable yet — skipping AUR publish (create it once, then re-run)."
            exit 0
          fi
          cp packaging/aur-cuda/PKGBUILD /tmp/aur-repo/PKGBUILD
          cp packaging/aur-cuda/.SRCINFO /tmp/aur-repo/.SRCINFO
          cd /tmp/aur-repo
          git config user.name "Pedrojok01"
          git config user.email "pedrojok@pm.me"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No AUR-side changes — already at $VERSION-1."; exit 0
          fi
          git commit -m "linux-broadcast-cuda ${VERSION}-1"
          git push origin master
