[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
yanked = "deny"
# zbus 5 (ours and ksni's) pulls these standalone crates, which zbus 6
# merged in. Unmaintained, not vulnerable. Drop the ignores, and move our
# own zbus to 6, once ksni depends on zbus 6.
ignore = [
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# egui's default fonts also declare the Ubuntu Font License
# (`Ubuntu-font-1.0`). Clarify the expression to drop that clause; the
# matching font file (Ubuntu-Light.ttf) is unused — egui defaults pick
# the OFL-1.1 fonts (Hack, NotoEmoji-Regular).
[[licenses.clarify]]
crate = "epaint_default_fonts"
expression = "(MIT OR Apache-2.0) AND OFL-1.1"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
